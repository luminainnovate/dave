services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    networks:
      - ai-workspace-net
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks:
      - ai-workspace-net
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      # Orchestrator Links
      - OLLAMA_BASE_URL=http://host.docker.internal:8000
      - IMAGE_GENERATION_ENGINE=openai
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=not-needed
      
      # Web Search (SearXNG) Integration
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - RAG_WEB_SEARCH_RESULT_COUNT=3
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
    depends_on:
      - searxng

  cline-builder:
    build:
      context: ./cline-builder
      dockerfile: Dockerfile
    container_name: cline-builder
    # Run as the invoking user, not root. Everything this container writes lands
    # in the bind-mounted workspace, and as root that made the user's own project
    # tree unwritable to them (a chown -R was needed to run the test suite).
    # Defaults to 1000:1000, the common single-user Linux uid. Override in .env:
    #   BUILDER_UID=$(id -u)  BUILDER_GID=$(id -g)
    user: "${BUILDER_UID:-1000}:${BUILDER_GID:-1000}"
    profiles:
      - build
    networks:
      - ai-workspace-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conversations:/workspace
      - ./cline-builder/agent_config.json:/app/agent_config.json:ro
      # Prompt bodies are referenced by relative path from agent_config.json,
      # so they must be present next to it inside the container.
      - ./cline-builder/prompts:/app/prompts:ro
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - AGENT_CONFIG_PATH=/app/agent_config.json
      # EXPERT_CTX is deliberately unset: distill.py falls back to
      # agent_config.json's context_window, which is the single place the window
      # is configured. The orchestrator still injects EXPERT_CTX when it launches
      # a build, and that continues to win. The previous 8192 here silently
      # overrode a 131072 config and over-committed every prompt.
      #
      # Database for DB-backed tests in the build phase. A generated project's own
      # .env says localhost:5432, which inside here is this container, not the
      # host - so these override it. The build agent cannot fix that itself: there
      # is no docker CLI and no socket in this image, so any `docker compose up -d`
      # it plans is a no-op.
      #
      # ⚠️ host.docker.internal ONLY WORKS IF THE DATABASE LISTENS ON ALL HOST
      # INTERFACES. veriform's own compose publishes Postgres as
      # `127.0.0.1:5432:5432` - deliberately, so the DB is not exposed off the box
      # - and this container reaches the host at the bridge address (172.17.0.1),
      # where nothing is listening. Every DB-backed test here dies ECONNREFUSED.
      # Verify before believing otherwise:
      #   docker run --rm --add-host host.docker.internal:host-gateway node:24-slim \
      #     bash -c 'timeout 5 bash -c "</dev/null >/dev/tcp/host.docker.internal/5432"'
      #
      # To actually reach a loopback-published DB, join its compose network instead
      # of going via the host, and point the URL at the container name. That is now
      # available as an opt-in override rather than something to hand-edit here:
      #   docker compose -f docker-compose.yml -f docker-compose.veriform.yml run cline-builder
      # It stays OUT of this file because an `external` network that does not exist
      # fails EVERY build, including ones with no database at all.
      #
      # Without that override a DB-backed gate cannot pass honestly: entrypoint.sh
      # classifies a refused connection as an environment fault, skips the gate and
      # self-reports completion. Any claim that data persisted needs the override.
      #
      # None of this affects `!bugfix`: its reproduction is required to run with
      # no database, server or network (bugfix.md B5), and distill.py classifies a
      # refused connection as an environment fault rather than as evidence against
      # the diagnosis.
      - DATABASE_URL=${DATABASE_URL:-postgres://vif:vif@host.docker.internal:5432/veriform}
      - TEST_DATABASE_URL=${TEST_DATABASE_URL:-postgres://vif:vif@host.docker.internal:5432/veriform_test}
    working_dir: /workspace

networks:
  ai-workspace-net:
    driver: bridge

volumes:
  open-webui_data: